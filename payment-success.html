<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Status | QSkill</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Poppins', Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #111827;
        }
        .box {
            width: min(560px, 90vw);
            background: white;
            border-radius: 20px;
            box-shadow: 0 24px 50px rgba(15, 23, 42, 0.12);
            padding: 36px 24px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }
        .icon {
            width: 88px;
            height: 88px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: rgba(79, 70, 229, 0.12);
            color: #4f46e5;
            display: grid;
            place-items: center;
            font-size: 42px;
        }
        h1 { margin: 0 0 10px; }
        p { margin: 0 0 22px; color: #4b5563; line-height: 1.7; }
        .btn {
            display: inline-block;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 600;
            margin: 0 8px 8px 0;
        }
        .secondary {
            background: white;
            color: #111827;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">✓</div>
        <h1>Payment Requested</h1>
        <p>Your UPI request is now open in your wallet app. Once the payment is approved, return to continue your enrollment.</p>
        <a class="btn" href="enroll.html?payment=success">Continue After Payment</a>
        <a class="btn secondary" href="enroll.html">Back to Enrollment</a>
    </div>
</body>
</html>
