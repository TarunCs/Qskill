<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - QSkill Career Solutions</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #F5F8FF;
        }

        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #DEEAFD 0%, #EAF1FF 50%, #FFFFFF 100%);
        }

        .login-container {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(31, 60, 136, 0.12);
            max-width: 440px;
            width: 100%;
            padding: 30px 32px 32px;
            border: 1px solid #e2e8f0;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Top row */
        .login-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .login-logo img {
            height: 55px;
            width: auto;
        }
        .back-link {
            color: #6b7280;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s;
            cursor: pointer;
        }
        .back-link:hover {
            color: #1f3c88;
        }
        .back-link i {
            margin-right: 4px;
        }

        /* Illustration */
        .login-photo-section {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        .login-photo-wrapper {
            max-width: 300px;
            width: 100%;
        }
        .login-photo-wrapper img {
            width: 100%;
            height: auto;
            object-fit: contain;
            max-height: 230px;
        }

        /* Header */
        .login-header {
            text-align: center;
            margin-bottom: 16px;
        }
        .login-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
        }
        .login-header h2 span {
            color: #1f3c88;
        }
        .login-header p {
            color: #6b7280;
            font-size: 13px;
            margin-top: 2px;
        }

        /* Tabs */
        .role-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #F1F4F9;
            padding: 4px;
            border-radius: 12px;
        }
        .role-tab {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            background: transparent;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .role-tab i {
            font-size: 14px;
        }
        .role-tab.active {
            background: #ffffff;
            color: #1f3c88;
            box-shadow: 0 2px 8px rgba(31, 60, 136, 0.08);
        }
        .role-tab:hover:not(.active) {
            color: #1e293b;
        }

        /* Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
        }
        .form-group label .required {
            color: #ef4444;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px 14px;
            transition: 0.3s;
            background: #FAFBFC;
        }
        .input-wrapper:focus-within {
            border-color: #1f3c88;
            box-shadow: 0 0 0 4px rgba(31, 60, 136, 0.08);
            background: #ffffff;
        }
        .input-wrapper i {
            color: #6b7280;
            font-size: 16px;
            margin-right: 10px;
        }
        .input-wrapper:focus-within i {
            color: #1f3c88;
        }
        .input-wrapper input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #1e293b;
            background: transparent;
        }
        .input-wrapper input::placeholder {
            color: #B0B8C4;
        }
        .input-wrapper .toggle-password {
            cursor: pointer;
            color: #6b7280;
            font-size: 16px;
            padding: 4px;
        }
        .input-wrapper .toggle-password:hover {
            color: #1e293b;
        }
        .input-wrapper.error {
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.08);
        }
        .input-wrapper.success {
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.08);
        }

        .error-message {
            display: none;
            font-size: 12px;
            color: #ef4444;
            align-items: center;
            gap: 4px;
        }
        .error-message.show {
            display: flex;
        }
        .error-message i {
            font-size: 13px;
        }

        /* Hide/show fields */
        #emailField {
            display: none !important;
        }
        #emailField.show {
            display: block !important;
        }
        #studentIdField {
            display: block !important;
        }
        #studentIdField.hide {
            display: none !important;
        }
        #passwordField {
            display: block !important;
        }
        #passwordField.hide {
            display: none !important;
        }

        /* Options */
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0 6px;
        }
        .login-options .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #6b7280;
            cursor: pointer;
        }
        .login-options .remember-me input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #1f3c88;
            cursor: pointer;
        }
        .login-options .forgot-link {
            font-size: 13px;
            color: #1f3c88;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .login-options .forgot-link:hover {
            text-decoration: underline;
        }

        /* Submit */
        .login-submit-btn {
            width: 100%;
            background: #1f3c88;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(31, 60, 136, 0.2);
            margin-top: 4px;
        }
        .login-submit-btn:hover:not(:disabled) {
            background: #162d6e;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(31, 60, 136, 0.3);
        }
        .login-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-submit-btn .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .login-submit-btn.loading .spinner {
            display: inline-block;
        }
        .login-submit-btn .btn-text {
            display: inline;
        }
        .login-submit-btn.loading .btn-text {
            opacity: 0.7;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Forgot modal */
        .forgot-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .forgot-modal-overlay.show {
            display: flex;
        }
        .forgot-modal {
            background: #ffffff;
            border-radius: 20px;
            padding: 32px 28px 28px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .forgot-modal h3 {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }
        .forgot-modal p {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 18px;
        }
        .forgot-modal .form-group {
            margin-bottom: 12px;
        }
        .forgot-modal .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            display: block;
            margin-bottom: 4px;
        }
        .forgot-modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .forgot-modal .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 999px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }
        .forgot-modal .modal-actions .btn-cancel {
            background: #f1f3f6;
            color: #1e293b;
        }
        .forgot-modal .modal-actions .btn-cancel:hover {
            background: #e5e7eb;
        }
        .forgot-modal .modal-actions .btn-send {
            background: #1f3c88;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(31, 60, 136, 0.2);
        }
        .forgot-modal .modal-actions .btn-send:hover:not(:disabled) {
            background: #162d6e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(31, 60, 136, 0.3);
        }
        .forgot-modal .modal-actions .btn-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .forgot-modal .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            font-size: 20px;
            color: #6b7280;
            cursor: pointer;
            transition: 0.3s;
        }
        .forgot-modal .modal-close:hover {
            color: #1e293b;
        }
        .forgot-modal .spinner-small {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        .forgot-modal .btn-send.loading .spinner-small {
            display: inline-block;
        }
        .forgot-modal .btn-send.loading .btn-text-modal {
            opacity: 0.7;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 20px 16px;
            }
            .login-logo img {
                height: 45px;
            }
            .login-header h2 {
                font-size: 19px;
            }
            .role-tab {
                font-size: 12px;
                padding: 6px 10px;
            }
            .role-tab i {
                font-size: 12px;
            }
            .input-wrapper {
                padding: 6px 12px;
            }
            .input-wrapper input {
                font-size: 13px;
            }
            .login-submit-btn {
                padding: 10px;
                font-size: 14px;
            }
            .login-photo-wrapper {
                max-width: 220px;
            }
            .login-photo-wrapper img {
                max-height: 170px;
            }
            .back-link {
                font-size: 12px;
            }
            .forgot-modal {
                padding: 24px 18px 20px;
            }
        }
        @media (max-height: 700px) {
            .login-container {
                padding: 16px 20px;
            }
            .login-logo img {
                height: 42px;
            }
            .login-header h2 {
                font-size: 18px;
            }
            .login-header p {
                font-size: 12px;
            }
            .login-header {
                margin-bottom: 10px;
            }
            .role-tabs {
                margin-bottom: 12px;
            }
            .role-tab {
                font-size: 12px;
                padding: 5px 8px;
            }
            .form-group {
                margin-bottom: 10px;
            }
            .form-group label {
                font-size: 12px;
            }
            .input-wrapper {
                padding: 6px 12px;
            }
            .input-wrapper input {
                font-size: 13px;
            }
            .login-options {
                margin: 6px 0 10px;
            }
            .login-submit-btn {
                padding: 10px;
                font-size: 14px;
            }
            .login-photo-wrapper {
                max-width: 220px;
            }
            .login-photo-wrapper img {
                max-height: 170px;
            }
            .login-photo-section {
                margin-bottom: 10px;
            }
            .back-link {
                font-size: 12px;
            }
        }
        @media (max-height: 600px) {
            .login-container {
                padding: 12px 16px;
            }
            .login-logo img {
                height: 32px;
            }
            .login-header h2 {
                font-size: 16px;
            }
            .login-header p {
                font-size: 11px;
            }
            .role-tab {
                font-size: 10px;
                padding: 4px 6px;
            }
            .role-tab i {
                font-size: 10px;
            }
            .form-group {
                margin-bottom: 6px;
            }
            .form-group label {
                font-size: 11px;
            }
            .input-wrapper {
                padding: 4px 10px;
            }
            .input-wrapper input {
                font-size: 12px;
            }
            .login-options {
                margin: 4px 0 8px;
            }
            .login-options .remember-me {
                font-size: 11px;
            }
            .login-options .forgot-link {
                font-size: 11px;
            }
            .login-submit-btn {
                padding: 8px;
                font-size: 12px;
            }
            .login-photo-wrapper {
                max-width: 180px;
            }
            .login-photo-wrapper img {
                max-height: 140px;
            }
            .login-photo-section {
                margin-bottom: 6px;
            }
            .back-link {
                font-size: 11px;
            }
            .forgot-modal {
                padding: 18px 14px 16px;
            }
            .forgot-modal h3 {
                font-size: 17px;
            }
            .forgot-modal .modal-actions button {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body class="login-page">

    <!-- ===== FORGOT PASSWORD MODAL ===== -->
    <div class="forgot-modal-overlay" id="forgotModalOverlay">
        <div class="forgot-modal">
            <button class="modal-close" id="forgotModalClose"><i class="fas fa-times"></i></button>
            <h3>🔐 Reset Password</h3>
            <p id="forgotModalDesc">Enter your Student ID to receive a password reset link.</p>
            <div class="form-group">
                <label for="forgotInput" id="forgotLabel">Student ID</label>
                <div class="input-wrapper" id="forgotWrapper">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="forgotInput" placeholder="Enter your Student ID" />
                </div>
                <span class="error-message" id="forgotError">
                    <i class="fas fa-exclamation-circle"></i> <span id="forgotErrorText">Please enter a valid ID</span>
                </span>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="forgotCancel">Cancel</button>
                <button class="btn-send" id="forgotSend">
                    <span class="btn-text-modal">Send Reset Link</span>
                    <span class="spinner-small"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== LOGIN CONTAINER ===== -->
    <div class="login-container">

        <div class="login-top">
            <div class="login-logo">
                <img src="images/logo.png" alt="QSkill Logo" />
            </div>
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>

        <div class="login-photo-section">
            <div class="login-photo-wrapper">
                <img src="images/login-illustration.png" alt="Working on laptop" />
            </div>
        </div>

        <div class="login-header">
            <h2>Welcome <span>Back</span></h2>
            <p id="roleSubtitle">Please enter your Student ID to continue.</p>
        </div>

        <div class="role-tabs" id="roleTabs">
            <button class="role-tab active" id="studentTab">
                <i class="fas fa-user-graduate"></i> Student
            </button>
            <button class="role-tab" id="instructorTab">
                <i class="fas fa-chalkboard-teacher"></i> Instructor
            </button>
        </div>

        <form class="login-form" id="loginForm" novalidate>

            <div class="form-group" id="emailField">
                <label for="emailInput">Email Address <span class="required">*</span></label>
                <div class="input-wrapper" id="emailWrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="emailInput" placeholder="Enter your email address" required />
                </div>
                <span class="error-message" id="emailError">
                    <i class="fas fa-exclamation-circle"></i> Please enter a valid email address
                </span>
            </div>

            <div class="form-group" id="studentIdField">
                <label for="studentIdInput">Student ID <span class="required">*</span></label>
                <div class="input-wrapper" id="studentIdWrapper">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="studentIdInput" placeholder="Enter your Student ID" required />
                </div>
                <span class="error-message" id="studentIdError">
                    <i class="fas fa-exclamation-circle"></i> Please enter a valid Student ID
                </span>
            </div>

            <div class="form-group" id="passwordField">
                <label for="passwordInput">Password <span class="required">*</span></label>
                <div class="input-wrapper" id="passwordWrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="passwordInput" placeholder="Enter your password" required minlength="6" />
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
                <span class="error-message" id="passwordError">
                    <i class="fas fa-exclamation-circle"></i> Please enter your password
                </span>
            </div>

            <div class="login-options" id="loginOptions">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" /> Remember me
                </label>
                <a href="#" class="forgot-link" id="forgotLink">Forgot Password?</a>
            </div>

            <button type="submit" class="login-submit-btn" id="loginSubmitBtn">
                <span class="btn-text">Login</span>
                <span class="spinner"></span>
            </button>

        </form>

    </div>

    <script>
        // ============================================================
        // COMPLETE LOGIN SCRIPT - NO ALERTS, DIRECT REDIRECT
        // ============================================================

        (function() {
            'use strict';

            console.log('🚀 Login page loaded');

            // --- Force correct student accounts ---
            var defaultStudents = {
                'QSK24012345': {
                    email: 'student@qskill.com',
                    phone: '9876543210',
                    password: 'a1b2c3d4e5f67890',
                    name: 'Demo Student'
                },
                'QSK24067890': {
                    email: 'demo@qskill.com',
                    phone: '9876543211',
                    password: 'f9e8d7c6b5a43210',
                    name: 'Demo User'
                }
            };

            var studentDb = JSON.parse(localStorage.getItem('qskillStudents')) || {};
            var needsUpdate = false;
            for (var key in defaultStudents) {
                if (!studentDb[key] || studentDb[key].password !== defaultStudents[key].password) {
                    studentDb[key] = defaultStudents[key];
                    needsUpdate = true;
                }
            }
            if (needsUpdate) {
                localStorage.setItem('qskillStudents', JSON.stringify(studentDb));
                console.log('✅ Default students set with correct passwords');
            }

            var instructorDb = {
                'instructor@qskill.com': { password: 'instructor123', name: 'Demo Instructor', role: 'instructor' },
                'admin@qskill.com': { password: 'admin123', name: 'Super Admin', role: 'admin' }
            };

            // --- DOM refs ---
            var studentTab = document.getElementById('studentTab');
            var instructorTab = document.getElementById('instructorTab');
            var roleSubtitle = document.getElementById('roleSubtitle');
            var emailField = document.getElementById('emailField');
            var studentIdField = document.getElementById('studentIdField');
            var passwordField = document.getElementById('passwordField');
            var emailInput = document.getElementById('emailInput');
            var studentIdInput = document.getElementById('studentIdInput');
            var passwordInput = document.getElementById('passwordInput');
            var emailWrapper = document.getElementById('emailWrapper');
            var studentIdWrapper = document.getElementById('studentIdWrapper');
            var passwordWrapper = document.getElementById('passwordWrapper');
            var emailError = document.getElementById('emailError');
            var studentIdError = document.getElementById('studentIdError');
            var passwordError = document.getElementById('passwordError');
            var togglePassword = document.getElementById('togglePassword');
            var loginForm = document.getElementById('loginForm');
            var loginSubmitBtn = document.getElementById('loginSubmitBtn');
            var forgotLink = document.getElementById('forgotLink');
            var forgotModalOverlay = document.getElementById('forgotModalOverlay');
            var forgotModalClose = document.getElementById('forgotModalClose');
            var forgotCancel = document.getElementById('forgotCancel');
            var forgotSend = document.getElementById('forgotSend');
            var forgotInput = document.getElementById('forgotInput');
            var forgotWrapper = document.getElementById('forgotWrapper');
            var forgotError = document.getElementById('forgotError');
            var forgotErrorText = document.getElementById('forgotErrorText');

            var currentRole = 'student';

            // --- Validate functions ---
            function validateStudentIdField() {
                var val = studentIdInput.value.trim();
                var ok = val !== '' && val.length >= 6;
                if (val === '') {
                    studentIdWrapper.classList.remove('success', 'error');
                    studentIdError.classList.remove('show');
                    return false;
                }
                if (ok) {
                    studentIdWrapper.classList.remove('error');
                    studentIdWrapper.classList.add('success');
                    studentIdError.classList.remove('show');
                    return true;
                } else {
                    studentIdWrapper.classList.remove('success');
                    studentIdWrapper.classList.add('error');
                    studentIdError.classList.add('show');
                    return false;
                }
            }

            function validatePasswordField() {
                var val = passwordInput.value;
                var ok = val.length >= 6;
                if (val === '') {
                    passwordWrapper.classList.remove('success', 'error');
                    passwordError.classList.remove('show');
                    return false;
                }
                if (ok) {
                    passwordWrapper.classList.remove('error');
                    passwordWrapper.classList.add('success');
                    passwordError.classList.remove('show');
                    return true;
                } else {
                    passwordWrapper.classList.remove('success');
                    passwordWrapper.classList.add('error');
                    passwordError.classList.add('show');
                    return false;
                }
            }

            function validateEmailField() {
                var val = emailInput.value.trim();
                var ok = val !== '' && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
                if (val === '') {
                    emailWrapper.classList.remove('success', 'error');
                    emailError.classList.remove('show');
                    return false;
                }
                if (ok) {
                    emailWrapper.classList.remove('error');
                    emailWrapper.classList.add('success');
                    emailError.classList.remove('show');
                    return true;
                } else {
                    emailWrapper.classList.remove('success');
                    emailWrapper.classList.add('error');
                    emailError.classList.add('show');
                    return false;
                }
            }

            // --- Role switching ---
            function switchToStudent() {
                studentTab.classList.add('active');
                instructorTab.classList.remove('active');
                currentRole = 'student';
                studentIdField.style.display = 'block';
                studentIdField.classList.remove('hide');
                emailField.style.display = 'none';
                emailField.classList.remove('show');
                passwordField.style.display = 'block';
                passwordField.classList.remove('hide');
                roleSubtitle.textContent = 'Welcome back! Please enter your Student ID to continue.';
                studentIdInput.placeholder = 'Enter your Student ID';
                passwordInput.placeholder = 'Enter your password';
                studentIdWrapper.classList.remove('error', 'success');
                passwordWrapper.classList.remove('error', 'success');
                studentIdError.classList.remove('show');
                passwordError.classList.remove('show');
            }

            function switchToInstructor() {
                instructorTab.classList.add('active');
                studentTab.classList.remove('active');
                currentRole = 'instructor';
                studentIdField.style.display = 'none';
                studentIdField.classList.add('hide');
                emailField.style.display = 'block';
                emailField.classList.add('show');
                passwordField.style.display = 'block';
                passwordField.classList.remove('hide');
                roleSubtitle.textContent = 'Please enter your email and password to continue.';
                emailInput.placeholder = 'Enter your email address';
                passwordInput.placeholder = 'Enter your password';
                emailWrapper.classList.remove('error', 'success');
                passwordWrapper.classList.remove('error', 'success');
                emailError.classList.remove('show');
                passwordError.classList.remove('show');
            }

            // --- Tab listeners ---
            studentTab.addEventListener('click', function(e) {
                e.preventDefault();
                if (currentRole !== 'student') switchToStudent();
            });

            instructorTab.addEventListener('click', function(e) {
                e.preventDefault();
                if (currentRole !== 'instructor') switchToInstructor();
            });

            // Initial role from URL
            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('role') === 'instructor') {
                switchToInstructor();
            } else {
                switchToStudent();
            }

            // --- Toggle password ---
            togglePassword.addEventListener('click', function() {
                var isPass = passwordInput.type === 'password';
                passwordInput.type = isPass ? 'text' : 'password';
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });

            // --- Login handlers (NO ALERTS, DIRECT REDIRECT) ---
            function handleStudentLogin() {
                var sid = studentIdInput.value.trim().toUpperCase();
                var pass = passwordInput.value;

                if (!validateStudentIdField()) {
                    return;
                }
                if (!validatePasswordField()) {
                    return;
                }

                var db = JSON.parse(localStorage.getItem('qskillStudents')) || {};
                var student = db[sid];

                if (!student) {
                    studentIdWrapper.classList.add('error');
                    studentIdError.classList.add('show');
                    return;
                }

                if (student.password !== pass) {
                    passwordWrapper.classList.add('error');
                    passwordError.classList.add('show');
                    return;
                }

                localStorage.setItem('qskillStudentLoggedIn', 'true');
                localStorage.setItem('qskillStudentId', sid);
                localStorage.setItem('qskillUser', JSON.stringify({
                    id: sid,
                    email: student.email,
                    phone: student.phone || '',
                    name: student.name || 'Student',
                    role: 'student'
                }));

                // ✅ Redirect to dashboard.html
                window.location.href = 'dashboard.html';
            }

            function handleInstructorLogin() {
                var email = emailInput.value.trim();
                var pass = passwordInput.value;

                if (!validateEmailField()) {
                    return;
                }
                if (!validatePasswordField()) {
                    return;
                }

                var user = instructorDb[email];

                if (!user) {
                    emailWrapper.classList.add('error');
                    emailError.classList.add('show');
                    return;
                }

                if (user.password !== pass) {
                    passwordWrapper.classList.add('error');
                    passwordError.classList.add('show');
                    return;
                }

                if (user.role === 'instructor') {
                    localStorage.setItem('qskillInstructorLoggedIn', 'true');
                } else if (user.role === 'admin') {
                    localStorage.setItem('qskillAdminLoggedIn', 'true');
                }

                localStorage.setItem('qskillUser', JSON.stringify({
                    email: email,
                    name: user.name,
                    role: user.role
                }));

                var redirectUrl = user.role === 'admin' ? 'admin.html' : 'instructor-dashboard.html';
                window.location.href = redirectUrl;
            }

            // --- Form submit ---
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                if (currentRole === 'student') {
                    handleStudentLogin();
                } else {
                    handleInstructorLogin();
                }
            });

            // --- Forgot Password Modal ---
            function openForgotModal() {
                forgotInput.value = '';
                forgotWrapper.classList.remove('error', 'success');
                forgotError.classList.remove('show');
                forgotSend.classList.remove('loading');
                forgotSend.disabled = false;
                forgotSend.querySelector('.btn-text-modal').textContent = 'Send Reset Link';
                if (currentRole === 'student') {
                    document.getElementById('forgotLabel').textContent = 'Student ID';
                    forgotInput.placeholder = 'Enter your Student ID';
                    document.getElementById('forgotModalDesc').textContent =
                        'Enter your Student ID to receive a password reset link.';
                } else {
                    document.getElementById('forgotLabel').textContent = 'Email Address';
                    forgotInput.placeholder = 'Enter your email address';
                    document.getElementById('forgotModalDesc').textContent =
                        'Enter your email address to receive a password reset link.';
                }
                forgotModalOverlay.classList.add('show');
                setTimeout(function() { forgotInput.focus(); }, 200);
            }

            function closeForgotModal() {
                forgotModalOverlay.classList.remove('show');
                forgotSend.classList.remove('loading');
                forgotSend.disabled = false;
                forgotSend.querySelector('.btn-text-modal').textContent = 'Send Reset Link';
            }

            forgotLink.addEventListener('click', function(e) {
                e.preventDefault();
                openForgotModal();
            });

            forgotModalClose.addEventListener('click', closeForgotModal);
            forgotCancel.addEventListener('click', closeForgotModal);

            forgotModalOverlay.addEventListener('click', function(e) {
                if (e.target === this) closeForgotModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && forgotModalOverlay.classList.contains('show')) {
                    closeForgotModal();
                }
            });

            // --- Forgot Send ---
            forgotSend.addEventListener('click', function(e) {
                e.preventDefault();

                var val = forgotInput.value.trim();
                if (!val) {
                    forgotWrapper.classList.add('error');
                    forgotError.classList.add('show');
                    forgotErrorText.textContent = 'Please enter your ' + (currentRole === 'student' ?
                        'Student ID' : 'email address');
                    return;
                }

                if (currentRole === 'instructor') {
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
                        forgotWrapper.classList.add('error');
                        forgotError.classList.add('show');
                        forgotErrorText.textContent = 'Please enter a valid email address';
                        return;
                    }
                } else {
                    val = val.toUpperCase();
                    forgotInput.value = val;
                    if (val.length < 6) {
                        forgotWrapper.classList.add('error');
                        forgotError.classList.add('show');
                        forgotErrorText.textContent = 'Student ID must be at least 6 characters';
                        return;
                    }
                }

                forgotWrapper.classList.remove('error', 'success');
                forgotError.classList.remove('show');

                var found = false,
                    userEmail = '';
                if (currentRole === 'student') {
                    var db = JSON.parse(localStorage.getItem('qskillStudents')) || {};
                    var s = db[val];
                    if (s) { found = true;
                        userEmail = s.email; }
                } else {
                    var u = instructorDb[val];
                    if (u) { found = true;
                        userEmail = val; }
                }

                if (!found) {
                    forgotWrapper.classList.add('error');
                    forgotError.classList.add('show');
                    forgotErrorText.textContent = currentRole === 'student' ? 'Student ID not found.' :
                        'Email not found.';
                    return;
                }

                forgotWrapper.classList.add('success');
                setTimeout(closeForgotModal, 1500);
            });

            console.log('✅ Login page ready!');
            console.log('📝 Student IDs: QSK24012345, QSK24067890');
            console.log('👨‍🏫 Instructor: instructor@qskill.com | Password: instructor123');
            console.log('👨‍💼 Admin: admin@qskill.com | Password: admin123');

        })();
    </script>

</body>
</html>
