<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Courses - QSkill Career Solutions</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <link rel="stylesheet" href="style.css" />

    <style>
        .page-header {
            padding: 40px 80px 20px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .page-header h1 span {
            color: var(--primary);
        }

        .page-header p {
            color: var(--text-gray);
            font-size: 16px;
            margin-top: 4px;
        }

        .all-courses-section {
            padding: 40px 80px 60px;
            background: var(--white);
        }

        .all-courses-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .all-courses-section .section-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .all-courses-section .section-header .course-count {
            color: var(--text-gray);
            font-size: 14px;
            background: var(--light-bg);
            padding: 4px 16px;
            border-radius: 999px;
        }

        .all-courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .all-course-card {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }

        .all-course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border-color: var(--primary);
        }

        .all-course-card .course-image {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            background: var(--light-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .all-course-card .course-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 12px;
        }

        .all-course-card .course-image .placeholder {
            font-size: 40px;
            color: var(--primary);
            opacity: 0.4;
        }

        .all-course-card .course-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .all-course-card .course-badge.manual {
            background: #DBEAFE;
            color: #2563EB;
        }

        .all-course-card .course-badge.automation {
            background: #DCFCE7;
            color: #16a34a;
        }

        .all-course-card .course-badge.api {
            background: #FEF3C7;
            color: #d97706;
        }

        .all-course-card .course-badge.playwright {
            background: #EDE9FE;
            color: #7C3AED;
        }

        .all-course-card .course-badge.cypress {
            background: #FCE4EC;
            color: #D81B60;
        }

        .all-course-card .course-badge.rest {
            background: #E3F2FD;
            color: #0D47A1;
        }

        .all-course-card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .all-course-card .description {
            font-size: 14px;
            color: var(--text-gray);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .all-course-card .rating {
            color: var(--star);
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 14px;
        }

        .all-course-card .rating span {
            color: var(--text-gray);
            font-weight: 400;
            font-size: 13px;
        }

        .all-course-card .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .all-course-card .btn-group .btn-enroll {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 8px 24px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        .all-course-card .btn-group .btn-enroll:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .all-course-card .btn-group .btn-details {
            background: transparent;
            color: var(--text-dark);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        .all-course-card .btn-group .btn-details:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--light-bg);
        }

        /* ===== ENROLLED BADGE ===== */
        .enrolled-badge {
            display: inline-block;
            background: #DCFCE7;
            color: #16a34a;
            padding: 4px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 64px;
            color: var(--border);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-gray);
            font-size: 16px;
            max-width: 400px;
            margin: 0 auto 20px;
        }

        .empty-state .btn-explore {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px 32px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        .empty-state .btn-explore:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        @media (max-width: 992px) {
            .page-header {
                padding: 30px 40px 15px;
            }
            .all-courses-section {
                padding: 30px 40px 40px;
            }
        }

        @media (max-width: 768px) {
            .page-header {
                padding: 20px;
            }
            .page-header h1 {
                font-size: 26px;
            }
            .all-courses-section {
                padding: 20px;
            }
            .all-courses-grid {
                grid-template-columns: 1fr;
            }
            .all-courses-section .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 22px;
            }
            .all-course-card {
                padding: 16px;
            }
            .all-course-card .btn-group {
                flex-direction: column;
            }
            .all-course-card .btn-group .btn-enroll,
            .all-course-card .btn-group .btn-details {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle" id="toastIcon"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <!-- ============================================================ -->
    <!-- ===== HEADER ===== -->
    <!-- ============================================================ -->
    <header class="header">
        <a href="index.html" class="logo">
            <span class="qskill">Q</span><span class="careersolutions">Solutions</span>
        </a>

        <ul class="header-menu">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="all-courses.html" class="active">Courses</a></li>
            <li><a href="my-courses.html">My Courses</a></li>
            <li><a href="#" onclick="logout()" style="color: #EF4444;">Logout</a></li>
        </ul>

        <div class="user-profile">
            <span class="name">Tejaswini</span>
            <span class="role-badge">Student</span>
            <div class="avatar">T</div>
        </div>
    </header>

    <!-- ============================================================ -->
    <!-- ===== PAGE HEADER ===== -->
    <!-- ============================================================ -->
    <section class="page-header">
        <h1>Available <span>Courses</span></h1>
        <p>Browse and enroll in new courses to expand your skills</p>
    </section>

    <!-- ============================================================ -->
    <!-- ===== ALL COURSES (EXCLUDING ENROLLED) ===== -->
    <!-- ============================================================ -->
    <section class="all-courses-section" id="allCoursesSection">

        <div class="section-header">
            <h2>Available Courses</h2>
            <span class="course-count" id="courseCount">0 Courses</span>
        </div>

        <div class="all-courses-grid" id="allCoursesGrid">
            <!-- Courses will be rendered by JavaScript -->
        </div>

    </section>

    <!-- ============================================================ -->
    <!-- ===== FOOTER ===== -->
    <!-- ============================================================ -->
    <footer class="footer">
        <div class="footer-content">
            <div class="copyright">© 2026 QSkill Career Solutions. All Rights Reserved.</div>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Contact</a>
                <a href="index.html">Home</a>
            </div>
        </div>
    </footer>

    <!-- ============================================================ -->
    <!-- ===== SCRIPTS ===== -->
    <!-- ============================================================ -->
    <script src="script.js"></script>

    <script>
        // ===== SESSION CHECK =====
        const studentLoggedIn = localStorage.getItem('qskillStudentLoggedIn');
        if (!studentLoggedIn) {
            window.location.href = 'login.html';
        }

        // ===== LOGOUT FUNCTION =====
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('qskillStudentLoggedIn');
                localStorage.removeItem('qskillStudentId');
                localStorage.removeItem('qskillUser');
                window.location.href = 'login.html';
            }
        }

        // ============================================================ */
        // ===== COURSE DATA ===== */
        // ============================================================ */
        const allCourses = [
            {
                id: 'manual',
                title: 'Manual Testing',
                description: 'Learn SDLC, STLC, test cases, defect tracking and more. Build a strong foundation in manual testing.',
                badge: 'manual',
                badgeText: '📋 Manual',
                rating: 4.8,
                reviews: 320,
                image: 'images/manual-testing.jpg',
                placeholder: false
            },
            {
                id: 'automation',
                title: 'Automation Testing (Selenium)',
                description: 'Learn Selenium with real-time projects, frameworks and CI/CD pipeline integration.',
                badge: 'automation',
                badgeText: '⚙️ Automation',
                rating: 4.7,
                reviews: 280,
                image: 'images/automation-testing.jpg',
                placeholder: false
            },
            {
                id: 'api',
                title: 'Postman API Testing',
                description: 'Learn REST API testing, Postman collections, automation and reporting.',
                badge: 'api',
                badgeText: '🔌 API',
                rating: 4.6,
                reviews: 210,
                image: 'images/api-testing.jpg',
                placeholder: false
            },
            {
                id: 'playwright',
                title: 'Playwright Automation',
                description: 'Learn end-to-end test automation using Microsoft Playwright with modern frameworks.',
                badge: 'playwright',
                badgeText: '🎭 Modern',
                rating: 4.5,
                reviews: 180,
                image: null,
                placeholder: true,
                placeholderIcon: '🎭'
            },
            {
                id: 'cypress',
                title: 'Cypress Automation',
                description: 'Learn modern UI automation using Cypress with real-world projects and debugging.',
                badge: 'cypress',
                badgeText: '🔄 Modern',
                rating: 4.4,
                reviews: 150,
                image: null,
                placeholder: true,
                placeholderIcon: '🔄'
            },
            {
                id: 'rest',
                title: 'REST Assured API Testing',
                description: 'Learn API automation using REST Assured with Java and integrate with frameworks.',
                badge: 'rest',
                badgeText: '📡 API',
                rating: 4.3,
                reviews: 120,
                image: null,
                placeholder: true,
                placeholderIcon: '📡'
            }
        ];

        // ============================================================ */
        // ===== ENROLLED COURSES (From localStorage) ===== */
        // ============================================================ */
        let enrolledCourses = JSON.parse(localStorage.getItem('enrolledCourses')) || [];

        // Default enrolled courses
        if (enrolledCourses.length === 0) {
            enrolledCourses = ['automation', 'manual', 'api'];
            localStorage.setItem('enrolledCourses', JSON.stringify(enrolledCourses));
        }

        // ============================================================ */
        // ===== RENDER AVAILABLE COURSES ===== */
        // ============================================================ */
        function renderAvailableCourses() {
            const grid = document.getElementById('allCoursesGrid');
            const count = document.getElementById('courseCount');

            // Filter out enrolled courses
            const availableCourses = allCourses.filter(course => !enrolledCourses.includes(course.id));

            // Update count
            count.textContent = `${availableCourses.length} Courses`;

            if (availableCourses.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <h3>All Caught Up!</h3>
                        <p>You are enrolled in all available courses. Check your enrolled courses or come back later for new courses.</p>
                        <a href="my-courses.html" class="btn-explore">Go to My Courses</a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = availableCourses.map(course => `
                <div class="all-course-card">
                    <div class="course-image">
                        ${course.image ? `<img src="${course.image}" alt="${course.title}" />` : 
                        `<div class="placeholder">${course.placeholderIcon}</div>`}
                    </div>
                    <span class="course-badge ${course.badge}">${course.badgeText}</span>
                    <h3>${course.title}</h3>
                    <p class="description">${course.description}</p>
                    <div class="rating">⭐ ${course.rating} <span>(${course.reviews} Reviews)</span></div>
                    <div class="btn-group">
                        <a href="courses-detail.html?course=${course.id}" class="btn-enroll">Enroll Now</a>
                        <a href="courses-detail.html?course=${course.id}" class="btn-details">View Details</a>
                    </div>
                </div>
            `).join('');
        }

        // ============================================================ */
        // ===== ENROLL IN COURSE ===== */
        // ============================================================ */
        function enrollCourse(courseId) {
            if (!enrolledCourses.includes(courseId)) {
                enrolledCourses.push(courseId);
                localStorage.setItem('enrolledCourses', JSON.stringify(enrolledCourses));
                showToast('✅ Successfully enrolled in the course!', 'success');
                renderAvailableCourses();
            } else {
                showToast('You are already enrolled in this course.', 'info');
            }
        }

        // ============================================================ */
        // ===== INITIALIZE ===== */
        // ============================================================ */
        document.addEventListener('DOMContentLoaded', function() {
            renderAvailableCourses();
        });

        console.log('📚 Available Courses Page Loaded');
        console.log('📌 Enrolled Courses:', enrolledCourses);
        console.log('📌 Available Courses:', allCourses.filter(c => !enrolledCourses.includes(c.id)).length);
    </script>

</body>
</html>
