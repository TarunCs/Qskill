<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Videos - Instructor | QSkill</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <link rel="stylesheet" href="style.css" />
    
    <style>
        .page-wrapper {
            padding: 30px 80px 60px;
            background: linear-gradient(135deg, #FAFBFC 0%, #F0F4F8 100%);
            min-height: 100vh;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 30px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
        }
        .page-header h1 span { color: var(--primary); }
        .back-btn {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 999px;
            font-weight: 500;
            color: var(--text-dark);
            text-decoration: none;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--light-bg);
            transform: translateX(-4px);
        }
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }
        .form-card, .video-list-card {
            background: var(--white);
            border-radius: 20px;
            padding: 30px 32px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            transition: box-shadow 0.3s;
        }
        .form-card:hover, .video-list-card:hover {
            box-shadow: 0 12px 40px rgba(31,60,136,0.08);
        }
        .form-card h3, .video-list-card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-dark);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: var(--text-dark);
        }
        .form-group label .required { color: var(--error); }
        .form-group .input-group {
            position: relative;
            display: flex;
            align-items: center;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s;
            background: #FAFBFC;
        }
        .form-group .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(31,60,136,0.08);
            background: var(--white);
        }
        .form-group .input-group i {
            padding: 0 14px;
            color: var(--text-gray);
            font-size: 18px;
            transition: 0.3s;
        }
        .form-group .input-group:focus-within i {
            color: var(--primary);
        }
        .form-group .input-group input,
        .form-group .input-group select,
        .form-group .input-group textarea {
            width: 100%;
            padding: 12px 14px 12px 0;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            background: transparent;
            color: var(--text-dark);
        }
        .form-group .input-group textarea { height: 80px; resize: vertical; }
        .form-group .input-group select { cursor: pointer; }
        .file-drop-zone {
            border: 2.5px dashed var(--border);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #FAFBFC;
        }
        .file-drop-zone:hover, .file-drop-zone.dragover {
            border-color: var(--primary);
            background: var(--light-bg);
            transform: translateY(-3px);
        }
        .file-drop-zone i {
            font-size: 48px;
            color: var(--primary);
            display: block;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .file-drop-zone:hover i { transform: scale(1.05); }
        .file-drop-zone p { color: var(--text-gray); font-size: 14px; }
        .file-drop-zone .small { font-size: 12px; color: #aaa; }
        .file-list {
            margin-top: 12px;
            max-height: 150px;
            overflow-y: auto;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #F5F7FA;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 13px;
            transition: 0.2s;
        }
        .file-item:hover { background: #EAEEF4; }
        .file-item .remove-btn {
            color: var(--error);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            padding: 0 4px;
        }
        .file-item .remove-btn:hover { color: #b91c1c; }
        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(31,60,136,0.15);
        }
        .btn-submit:hover {
            background: var(--secondary);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(31,60,136,0.25);
        }
        .video-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #F1F5F9;
        }
        .video-item:last-child { border-bottom: none; }
        .video-item .thumb {
            width: 60px;
            height: 40px;
            background: var(--light-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 20px;
            flex-shrink: 0;
        }
        .video-item .info { flex: 1; }
        .video-item .info .title { font-weight: 600; font-size: 14px; color: var(--text-dark); }
        .video-item .info .meta { font-size: 12px; color: var(--text-gray); }
        .video-item .status {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 999px;
            background: #DCFCE7;
            color: #16a34a;
        }
        @media (max-width: 992px) {
            .grid-2col { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .page-wrapper { padding: 20px; }
            .form-card, .video-list-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle" id="toastIcon"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <nav class="navbar">...</nav>

    <section class="page-wrapper">
        <div class="page-header">
            <h1>📹 Upload <span>Videos</span></h1>
            <a href="instructor-dashboard.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="grid-2col">
            <div class="form-card">
                <h3><i class="fas fa-upload" style="color:var(--primary);"></i> Upload New Video</h3>
                <form id="uploadVideoForm" onsubmit="handleUploadVideo(event)">
                    <div class="form-group">
                        <label>Video Title <span class="required">*</span></label>
                        <div class="input-group">
                            <i class="fas fa-heading"></i>
                            <input type="text" id="videoTitle" placeholder="e.g. Selenium Introduction" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Course <span class="required">*</span></label>
                        <div class="input-group">
                            <i class="fas fa-book"></i>
                            <select id="videoCourse" required>
                                <option value="">Select course</option>
                                <option value="manual">Manual Testing</option>
                                <option value="automation">Automation Testing</option>
                                <option value="api">API Testing</option>
                                <option value="playwright">Playwright</option>
                                <option value="cypress">Cypress</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <div class="input-group">
                            <i class="fas fa-align-left" style="align-self:flex-start; padding-top:14px;"></i>
                            <textarea id="videoDescription" placeholder="What is this video about?"></textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Select Video Files <span class="required">*</span></label>
                        <div class="file-drop-zone" id="dropZone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Drag &amp; drop video files here or click to browse</p>
                            <span class="small">MP4, AVI, MOV, WEBM • Max 100MB each</span>
                            <input type="file" id="videoFiles" accept="video/*" multiple style="display:none;" onchange="updateFileList()" />
                            <div class="file-list" id="fileList"></div>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-check-circle"></i> Upload Videos
                    </button>
                </form>
            </div>
            <div class="video-list-card">
                <h3><i class="fas fa-list" style="color:var(--primary);"></i> Uploaded Videos</h3>
                <div id="videoListContainer">
                    <p style="color: var(--text-gray); font-size:14px; padding:20px 0;">No videos uploaded yet.</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">...</footer>

    <script>
        // Drag & Drop handling
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('videoFiles');

        ['dragenter', 'dragover'].forEach(event => {
            dropZone.addEventListener(event, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
        });
        ['dragleave', 'drop'].forEach(event => {
            dropZone.addEventListener(event, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });
        });
        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            fileInput.files = files;
            updateFileList();
        });
        dropZone.addEventListener('click', () => fileInput.click());

        let uploadedVideos = JSON.parse(localStorage.getItem('qskillVideos')) || [];

        function updateFileList() {
            const input = fileInput;
            const list = document.getElementById('fileList');
            const files = input.files;
            if (files.length === 0) {
                list.innerHTML = '';
                return;
            }
            let html = '';
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const size = (file.size / (1024 * 1024)).toFixed(2);
                html += `
                    <div class="file-item">
                        <span>🎬 ${file.name} (${size} MB)</span>
                        <button type="button" class="remove-btn" onclick="removeFile(${i})">&times;</button>
                    </div>
                `;
            }
            list.innerHTML = html;
        }

        function removeFile(index) {
            const input = fileInput;
            const dt = new DataTransfer();
            const files = input.files;
            for (let i = 0; i < files.length; i++) {
                if (i !== index) dt.items.add(files[i]);
            }
            input.files = dt.files;
            updateFileList();
        }

        function renderVideoList() {
            const container = document.getElementById('videoListContainer');
            if (uploadedVideos.length === 0) {
                container.innerHTML = `<p style="color: var(--text-gray); font-size:14px; padding:20px 0;">No videos uploaded yet.</p>`;
                return;
            }
            let html = '';
            uploadedVideos.forEach((video) => {
                const date = new Date(video.uploadedAt).toLocaleDateString();
                html += `
                    <div class="video-item">
                        <div class="thumb"><i class="fas fa-video"></i></div>
                        <div class="info">
                            <div class="title">${video.title}</div>
                            <div class="meta">${video.course} • ${video.files.length} file(s) • ${date}</div>
                        </div>
                        <span class="status">Uploaded</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function handleUploadVideo(e) {
            e.preventDefault();
            const title = document.getElementById('videoTitle').value.trim();
            const course = document.getElementById('videoCourse').value;
            const description = document.getElementById('videoDescription').value.trim();
            const files = fileInput.files;

            if (!title || !course || files.length === 0) {
                showToast('Please fill in all required fields and select at least one video.', 'error');
                return;
            }

            const videoEntry = {
                id: Date.now(),
                title: title,
                course: course,
                description: description,
                files: Array.from(files).map(f => ({ name: f.name, size: f.size, type: f.type })),
                uploadedAt: new Date().toISOString()
            };
            uploadedVideos.push(videoEntry);
            localStorage.setItem('qskillVideos', JSON.stringify(uploadedVideos));

            showToast(`✅ ${files.length} video(s) uploaded successfully!`, 'success');
            document.getElementById('uploadVideoForm').reset();
            document.getElementById('fileList').innerHTML = '';
            fileInput.value = '';
            renderVideoList();
        }

        // ... logout, showToast, session check
        renderVideoList();
    </script>
</body>
</html>
